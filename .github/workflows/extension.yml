name: Build and test Chrome extension
on:
  push:
    branches: [main]
    paths: ['extension/**', 'scripts/build-extension.mjs', 'src/engine.ts', 'package*.json', '.github/workflows/extension.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested ZIP and checksum as a GitHub release
        type: boolean
        default: false
      live_tradingview:
        description: Run the opt-in public Supercharts smoke test
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run extension:build
      - run: npx playwright install --with-deps chromium
      - run: npm run extension:test
        env:
          OBSIDIAN_LIVE_SITE_TEST: ${{ github.event.inputs.live_tradingview || 'false' }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: extension-test-diagnostics
          path: test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: obsidian-chrome-extension
          path: |
            releases/obsidian-extension-v1.0.0.zip
            releases/obsidian-extension-v1.0.0.zip.sha256

  release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true' && github.ref == 'refs/heads/main'
    needs: extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: obsidian-chrome-extension
          path: release
      - name: Publish verified extension package
        run: gh release create obsidian-extension-v1.0.0 release/obsidian-extension-v1.0.0.zip release/obsidian-extension-v1.0.0.zip.sha256 --repo "$GH_REPO" --target "$SOURCE_SHA" --title 'Obsidian TradingView Companion v1.0.0' --notes-file extension/RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}

services:
  obsidian:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:?Use paper API credentials only}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:?Use paper API credentials only}
      PAPER_KILL_SWITCH: ${PAPER_KILL_SWITCH:-false}
    volumes:
      - paper-state:/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
volumes:
  paper-state:
